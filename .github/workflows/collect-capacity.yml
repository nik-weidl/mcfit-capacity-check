name: Collect McFIT Germany Capacity (All 175 Studios)

on:
  schedule:
    # Runs twice daily:
    # 1) 14:45 UTC (15:45 CET / 16:45 CEST) - Afternoon checkpoint
    # 2) 21:50 UTC (22:50 CET / 23:50 CEST) - Late-night snapshot capturing the full 24h day before McFIT resets at midnight
    - cron: '45 14 * * *'
    - cron: '50 21 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch daily capacity for all German McFIT studios
        run: node scripts/fetch-capacity.mjs

      - name: Commit and push updated capacity history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/studios.json
          if git diff --staged --quiet; then
            echo "No capacity changes to commit."
          else
            git commit -m "chore(data): update McFIT capacity snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

